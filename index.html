<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/audify-icon.png" />
    <title>Audify</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0D0D0F;
        overflow: hidden;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background-color: #F5F5F7;
      }
      html[data-theme="contrast"],
      html[data-theme="contrast"] body,
      html[data-theme="contrast"] #root {
        background-color: #000000;
      }
    </style>
  </head>
  <body class="bg-surface-0 text-fg antialiased selection:bg-accent selection:text-accent-on overflow-hidden">

    <script type="module" src="/src/main.tsx"></script>
