[package]
name = "audify"
version = "1.0.2"
description = "Pro-Audio Sample & SFX Manager for NLE/DAW Workflows"
authors = ["Audify Contributors"]
edition = "2021"

[lib]
name = "audify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
lofty = "0.21"
walkdir = "2"
rayon = "1"
rfd = "0.16"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
notify = "9"

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
drag = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
